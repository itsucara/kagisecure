# cargo-deny: what this project will and will not depend on.
#
#     cargo deny check          # everything below
#     cargo deny check licenses
#     cargo deny check advisories
#
# Run locally (`make deny` / `cargo deny check`) and by `cargo xtask dist` before a release; it
# ran in CI on every push until CI was removed on 2026-09-19. A secrets manager's
# dependency tree is part of its threat model: an advisory in a crate that touches key material is
# a vulnerability in kagisecure, and a license nobody read is a legal problem shipped to users.

[graph]
# The platforms kagisecure is actually built for. Without this, `cargo deny` walks Windows and
# Linux-only dependency edges that nothing here compiles, and reports on crates that are never in
# a shipped binary. Linux and Windows stay in the list because the intent is for the core crate to
# build and test on both — but the CI job that verified that was removed on 2026-09-19, and nothing
# currently checks it. Treat these two targets as aspirational until something exercises them again.
targets = [
    { triple = "aarch64-apple-darwin" },
    { triple = "x86_64-apple-darwin" },
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "x86_64-pc-windows-msvc" },
]
all-features = true

[advisories]
# RustSec. `deny` for anything with a patched version available; the exceptions below are
# individually justified, and an empty list is the goal.
version = 2
yanked = "deny"
ignore = []

[licenses]
version = 2
# Permissive licenses only, and no copyleft. kagisecure is MIT OR Apache-2.0 and is linked
# statically into a distributed application; a GPL or LGPL dependency would change what the
# project can be, which is a decision for a human and not for a lockfile update.
allow = [
    "MIT",
    "Apache-2.0",
    # BSD Zero Clause: MIT without the attribution requirement, i.e. strictly more permissive than
    # everything else on this list. Reached through `interprocess` (`recvmsg`) and `rmcp`
    # (`doctest-file`).
    "0BSD",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
    "Unlicense",
]
# A crate whose license text differs slightly from the SPDX canonical wording still counts, as
# long as the match is this close. Below this and a human should read the file.
confidence-threshold = 0.8
exceptions = []

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Network code, banned outright for the whole workspace. kagisecure has no HTTP client, no TLS, no
# sync service and no git integration (architecture §9, threat-model N-9), and shared vaults keep
# it that way: they are exchanged by people, as files in a folder or a bundle, and kagisecure never
# runs git or opens a connection (ADR-0035 §7, alternative (e)). Any of these arriving in the lock
# file — directly or deep in someone else's tree — is a design change for a human to make, not a
# side effect of a dependency update. `kagisecure-shared`'s `tests/dependency_guard.rs` checks the
# same list, plus the socket and async-runtime crates the local IPC legitimately uses elsewhere.
deny = [
    { crate = "reqwest", reason = "HTTP client: kagisecure has no network code (threat-model N-9)" },
    { crate = "hyper", reason = "HTTP: kagisecure has no network code (threat-model N-9)" },
    { crate = "ureq", reason = "HTTP client: kagisecure has no network code (threat-model N-9)" },
    { crate = "curl", reason = "HTTP client: kagisecure has no network code (threat-model N-9)" },
    { crate = "h2", reason = "HTTP/2: kagisecure has no network code (threat-model N-9)" },
    { crate = "rustls", reason = "TLS: kagisecure has no network code (threat-model N-9)" },
    { crate = "native-tls", reason = "TLS: kagisecure has no network code (threat-model N-9)" },
    { crate = "openssl", reason = "TLS: kagisecure has no network code (threat-model N-9)" },
    { crate = "isahc", reason = "HTTP client: kagisecure has no network code (threat-model N-9)" },
    { crate = "git2", reason = "git client: shared vaults never run git (ADR-0035 §7)" },
    { crate = "gix", reason = "git client: shared vaults never run git (ADR-0035 §7)" },
    { crate = "hyper-util", reason = "HTTP: kagisecure has no network code (threat-model N-9)" },
    { crate = "attohttpc", reason = "HTTP client: kagisecure has no network code (threat-model N-9)" },
    { crate = "minreq", reason = "HTTP client: kagisecure has no network code (threat-model N-9)" },
    { crate = "surf", reason = "HTTP client: kagisecure has no network code (threat-model N-9)" },
    { crate = "tungstenite", reason = "WebSocket: kagisecure has no network code (threat-model N-9)" },
    { crate = "tokio-tungstenite", reason = "WebSocket: kagisecure has no network code (threat-model N-9)" },
    { crate = "quinn", reason = "QUIC: kagisecure has no network code (threat-model N-9)" },
    { crate = "hickory-resolver", reason = "DNS resolver: kagisecure has no network code (threat-model N-9)" },
    { crate = "trust-dns-resolver", reason = "DNS resolver: kagisecure has no network code (threat-model N-9)" },
    { crate = "openssl-sys", reason = "TLS: kagisecure has no network code (threat-model N-9)" },
    { crate = "curl-sys", reason = "HTTP client: kagisecure has no network code (threat-model N-9)" },
    { crate = "ssh2", reason = "SSH client: shared vaults never reach a remote (ADR-0035 §7)" },
    { crate = "libssh2-sys", reason = "SSH client: shared vaults never reach a remote (ADR-0035 §7)" },
    { crate = "gix-transport", reason = "git transport: shared vaults never run git (ADR-0035 §7)" },
    { crate = "gix-protocol", reason = "git protocol: shared vaults never run git (ADR-0035 §7)" },
]
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# crates.io and nothing else. A git dependency in a project that ships signed binaries is a
# supply-chain input with no version, no checksum in the registry and no audit trail.
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
