[package]
name = "xtask"
description = "Repository automation: Swift binding generation and packaging."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[dependencies]
# `cli` pulls in `bindgen`, which is what exposes `generate_swift_bindings`.
uniffi = { version = "0.32", features = ["cli"] }
anyhow = "1"
camino = "1"
# `bindgen-cs` generates the C# P/Invoke declarations from `kagisecure-ffi`'s `capi` sources
# (ADR-0003's fallback). A dependency of this tool only — never of a shipped crate — so the Swift
# build and the DLL never compile it.
csbindgen = "1.9.8"
# `chrome-package` reads the extension manifest to drop `key` and set `version`, and writes the
# store's zip. Both are already in the lockfile (the CLI and the importer use them), with the same
# features, so this adds nothing to what the workspace compiles.
serde_json = "1"
zip = { version = "8", default-features = false, features = ["deflate"] }
