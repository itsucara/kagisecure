[package]
name = "xtask"
description = "Repository automation: Swift binding generation and packaging."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[dependencies]
# `cli` pulls in `bindgen`, which is what exposes `generate_swift_bindings`.
uniffi = { version = "0.32", features = ["cli"] }
anyhow = "1"
camino = "1"
