# XcodeGen spec. `xcodegen generate` in this directory produces Kagisecure.xcodeproj, which is
# NOT checked in (see .gitignore and docs/decisions/0010-*.md): the project file is a build
# artifact of this spec, and a generated project in review noise is worse than a spec in review.

name: Kagisecure
options:
  bundleIdPrefix: com.kagisecure
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "15.0"
  groupSortPosition: top

packages:
  KagisecureFFI:
    # Local package. `cargo xtask bindgen` must have run at least once: it writes both the
    # generated Swift and the xcframework the package's binaryTarget points at.
    path: KagisecureFFI

# Project-wide settings. Signing defaults to ad-hoc so that a clean checkout can build
# with no developer account at all (CI could too, before it was removed on 2026-09-19). To build
# with a real identity, use the Makefile:
#
#     make macos SIGN=developer-id
#
# which passes CODE_SIGN_IDENTITY="Developer ID Application" and the team it finds in the
# keychain (ADR-0025). Everything the app itself does works under ad-hoc signing except two
# things, and both fail loudly rather than silently:
#
#   * the Secure Enclave key (ADR-0011) — still blocked even under Developer ID, because
#     `keychain-access-groups` is a *restricted* entitlement that AMFI validates against a
#     provisioning profile and kills the process for at exec time;
#   * the Safari Web Extension (ADR-0024), which needs the App Group below, which needs a team.
#     App Groups, unlike keychain access groups, work under Developer ID with no profile.
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    # The single place the version is written on this side of the FFI boundary. Every
    # CFBundleShortVersionString/CFBundleVersion below is `$(MARKETING_VERSION)` /
    # `$(CURRENT_PROJECT_VERSION)`, so the app and the app extension cannot drift apart, and
    # `cargo xtask version` fails the build if either stops matching the workspace version in
    # Cargo.toml (ADR-0028). Both are the same string on purpose: kagisecure ships one artifact
    # per version and has no separate build number to count. Override on the xcodebuild command
    # line if a rebuild of the same version ever has to be distinguishable.
    MARKETING_VERSION: "0.1.1"
    CURRENT_PROJECT_VERSION: "0.1.1"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    CODE_SIGNING_REQUIRED: YES
    CODE_SIGNING_ALLOWED: YES
    ENABLE_HARDENED_RUNTIME: YES
    # App Sandbox is deliberately off; see ADR-0010. M4's Unix-domain socket lives outside a
    # container, and the sandboxed path would be a different, undocumented one. The Safari
    # extension target below overrides this to YES — Safari will not load an unsandboxed web
    # extension — which is why the two halves need an App Group to share a socket at all.
    ENABLE_APP_SANDBOX: NO
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: complete
    CLANG_ENABLE_MODULES: YES
    DEAD_CODE_STRIPPING: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: YES
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO

targets:
  Kagisecure:
    type: application
    platform: macOS
    sources:
      - path: Kagisecure
    dependencies:
      - package: KagisecureFFI
        product: KagisecureFFI
      # Embedded into Contents/PlugIns and signed with the app. Safari finds a web extension only
      # inside an installed containing app, so this is not optional packaging — it is the only way
      # the extension exists at all.
      - target: KagisecureSafariExtension
        embed: true
        codeSign: true
    info:
      path: Kagisecure/Info.plist
      properties:
        CFBundleName: Kagisecure
        CFBundleDisplayName: Kagisecure
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        # Must equal MACOSX_DEPLOYMENT_TARGET above. Gatekeeper does not check it, but Finder and
        # the App Store-style "requires macOS X" line do, and a bundle that claims to run on a
        # system its binaries were not built for is a support ticket with no error message.
        LSMinimumSystemVersion: "$(MACOSX_DEPLOYMENT_TARGET)"
        LSApplicationCategoryType: public.app-category.productivity
        # Generated by Scripts/make-icon.sh from Artwork/icon-1024.png, which `make macos` and
        # `cargo xtask dist` run when the file is missing.
        CFBundleIconFile: Kagisecure
        NSHumanReadableCopyright: "kagisecure contributors. MIT OR Apache-2.0."
        # The string macOS shows above the Touch ID sheet when the Secure Enclave key is used.
        NSFaceIDUsageDescription: "Unlock your kagisecure vault."
    entitlements:
      path: Kagisecure/Kagisecure.entitlements
      properties:
        # Sandbox off (ADR-0010). `keychain-access-groups` — which the Secure Enclave key needs —
        # is a *restricted* entitlement whose mere presence makes Xcode demand a provisioning
        # profile, so a clean checkout could not build (nor could CI, before it was removed on
        # 2026-09-19). It lives in
        # Signing/Provisioned.entitlements instead, for builds that have a team; see ADR-0011.
        com.apple.security.app-sandbox: false
        # The App Group the Safari extension reaches this app through (ADR-0024). Unlike
        # `keychain-access-groups` this is **not** restricted: a Developer ID signature carries it
        # with no provisioning profile, which is what makes the Safari front end shippable while
        # the Secure Enclave path is still blocked. `$(AppIdentifierPrefix)` expands to the team
        # identifier plus a dot, so a fork with its own team gets its own group with no edit here;
        # under ad-hoc signing there is no team, the group is meaningless, and the app says so on
        # the Browser extension screen rather than pretending to serve Safari.
        com.apple.security.application-groups:
          - $(AppIdentifierPrefix)com.kagisecure
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kagisecure.app
        PRODUCT_NAME: Kagisecure
        COMBINE_HIDPI_IMAGES: YES
        ENABLE_PREVIEWS: YES
    # Note what is NOT here: a build phase that embeds the three helper binaries. Two things
    # rule one out. A Copy Files phase names files that must exist when the project is
    # *generated*, and a clean checkout has not built them yet; and a Run Script phase cannot do
    # the job either, because `ENABLE_USER_SCRIPT_SANDBOXING` (above, and worth keeping) denies a
    # script both the read of a binary outside the project and the `codesign` that has to follow
    # it. So `cargo xtask embed` does it after the build instead, which also puts the inside-out
    # signing order somewhere a reader can see it. See ADR-0026.

  # The Safari Web Extension (M6b, ADR-0024).
  #
  # Hand-maintained rather than produced by `xcrun safari-web-extension-converter`: the converter
  # scaffolds a project, and this repository's project *is* this file (ADR-0010). What the
  # converter would generate is two Swift files, an Info.plist and a resource copy, all of which
  # are below and all of which are reviewable in a diff.
  KagisecureSafariExtension:
    type: app-extension
    platform: macOS
    sources:
      - path: KagisecureSafariExtension
      # The extension's own code — the *same* directory Chromium loads unpacked. Copied flat into
      # Contents/Resources, which is where Safari looks for `manifest.json`. `manifest.json` is
      # excluded here and supplied from extensions/safari below: the two manifests differ only in
      # the Chromium-specific keys (`key`, `minimum_chrome_version`), and giving Safari a manifest
      # with no keys it does not understand is cheaper than explaining a warning to every reader.
      - path: ../../extensions/shared
        buildPhase: resources
        excludes:
          - manifest.json
        createIntermediateGroups: false
      - path: ../../extensions/safari/manifest.json
        buildPhase: resources
    info:
      path: KagisecureSafariExtension/Info.plist
      properties:
        CFBundleName: Kagisecure
        CFBundleDisplayName: Kagisecure
        # Same variables as the app's. An app extension whose version disagrees with its
        # container is something Apple's validation notices and users never can.
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSHumanReadableCopyright: "kagisecure contributors. MIT OR Apache-2.0."
        NSExtension:
          NSExtensionPointIdentifier: com.apple.Safari.web-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).SafariWebExtensionHandler
    entitlements:
      path: KagisecureSafariExtension/KagisecureSafariExtension.entitlements
      properties:
        # ON, and only here. Safari refuses to load an unsandboxed web extension, so this is not a
        # choice — it is the constraint the transport had to be designed around (ADR-0010 for why
        # the app is not sandboxed, ADR-0024 for what that costs).
        com.apple.security.app-sandbox: true
        # The one hole in that sandbox, and the whole transport: a directory both halves can see.
        # The extension reads this value back from its own entitlement at run time rather than
        # hardcoding it, so a fork's group follows its team automatically.
        com.apple.security.application-groups:
          - $(AppIdentifierPrefix)com.kagisecure
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kagisecure.app.safari-extension
        # Must match `kagisecure_extension_ipc::SAFARI_EXTENSION_EXECUTABLE`: the app identifies
        # the process on the Safari socket by this executable's path before it will serve it.
        PRODUCT_NAME: KagisecureSafariExtension
        PRODUCT_MODULE_NAME: KagisecureSafariExtension
        ENABLE_APP_SANDBOX: YES
        SKIP_INSTALL: YES
        # An app extension has no main(); it is loaded by the host process.
        CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO

  # The XCUITest bundle (docs/e2e-harness.md §7, suite D). Separate from `KagisecureTests`
  # because it is a different kind of thing: that one is hosted *in* the app and calls its types,
  # this one launches the app as a black box and drives its accessibility tree.
  KagisecureUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: KagisecureUITests
    dependencies:
      - target: Kagisecure
    info:
      path: KagisecureUITests/Info.plist
      properties:
        CFBundleName: KagisecureUITests
        CFBundlePackageType: BNDL
    # Written explicitly, because Xcode's default for a macOS UI-testing bundle is a **sandboxed**
    # `XCTRunner.app` with a read-only exception for `/` — and a sandboxed runner cannot build the
    # world a scenario needs. Suite D's scenarios create a scratch vault, bind a socket, write
    # screenshots into the harness's artifact directory and spawn a real `kagisecure-mcp`, none of
    # which a container permits (and a child of a sandboxed process inherits the container, so the
    # sidecar would be trapped too). The app under test is not sandboxed either — ADR-0010 — so
    # this target is not loosening anything the product relies on. It ships nowhere: it is a test
    # bundle, built only by `make e2e SUITE=app`.
    entitlements:
      path: KagisecureUITests/KagisecureUITests.entitlements
      properties:
        com.apple.security.app-sandbox: false
        com.apple.security.get-task-allow: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kagisecure.app.uitests
        TEST_TARGET_NAME: Kagisecure
        # OFF, and it has to be. The hardened runtime implies **library validation**, which
        # requires a loaded bundle to carry the same Team ID as the process loading it. Under
        # ad-hoc signing there is no team, so every binary gets its own identity derived from its
        # own hash — and `XCTRunner`, which Xcode builds and signs for us, then refuses to dlopen
        # this bundle with "mapping process and mapped file (non-platform) have different Team
        # IDs". The project-wide default is YES (see `settings:` at the top) and stays YES for
        # everything that ships; this target ships nowhere.
        ENABLE_HARDENED_RUNTIME: NO

  KagisecureTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: KagisecureTests
      # The app extension's transport, compiled a second time into the test bundle rather than
      # reimplemented in it. The point of `SafariExtensionTransportTests` is that the bytes the
      # test puts on the wire are the bytes the shipped extension puts on the wire; a test-local
      # copy of the framing would assert only that the test agrees with itself.
      - path: KagisecureSafariExtension/AppGroupSocket.swift
    dependencies:
      # Hosted in the app, on purpose: the Secure Enclave test is only meaningful inside a process
      # carrying the app's own code signature, and a keychain query from a free-standing xctest
      # runner would be testing a different program than the one we ship.
      - target: Kagisecure
      # `link: false` because the app already links the static library. Linking it again into the
      # test bundle would give the process two copies of the Rust runtime and two handle maps.
      # This dependency exists only so the test module can `import KagisecureFFI` and name types.
      - package: KagisecureFFI
        product: KagisecureFFI
        link: false
    info:
      path: KagisecureTests/Info.plist
      properties:
        CFBundleName: KagisecureTests
        CFBundlePackageType: BNDL
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kagisecure.app.tests

schemes:
  Kagisecure:
    build:
      targets:
        Kagisecure: all
        KagisecureSafariExtension: all
        KagisecureTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - KagisecureTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

  # A scheme of its own, deliberately. `make macos-test` runs the `Kagisecure` scheme and must stay
  # what it is: 91 hosted unit tests in a few seconds, runnable on any machine. The XCUITest bundle
  # launches the real app, needs a window server and a login session, and takes minutes — putting
  # it in the same test action would make the cheap gate expensive and would fail on a headless
  # box. `e2e/suites/app/run-xcuitest.sh` builds and runs this one.
  KagisecureUITests:
    build:
      targets:
        Kagisecure: all
        KagisecureSafariExtension: all
        KagisecureUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - KagisecureUITests
