[package]
name = "kagisecure-import"
description = "Importing vaults exported from other password managers into kagisecure."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
# Explicit, the same posture as the CLI and the FFI crate: this crate constructs `Secret`, so it
# asks for the feature by name rather than inheriting it (ADR-0002 §3).
kagisecure-core = { workspace = true, features = ["secret-material"] }
serde = { version = "1", features = ["derive"] }
# The 1PUX payload is JSON; the report is serialized to JSON by the CLI and the FFI layer.
serde_json = "1"
# `Field::extra` and `Item::extra` are CBOR values.
ciborium = "0.2"
csv = "1"
# `default-features = false`: the defaults pull in bzip2, zstd, lzma, deflate64 and AES, none of
# which a 1PUX file uses and all of which would widen the audited graph for nothing (plan §2).
zip = { version = "8", default-features = false, features = ["deflate"] }
# Already in the graph through kagisecure-core. Used for the dedupe fingerprint and for the
# history merge key — never to redact or truncate a value (ADR-0002 §1 point 3).
sha2 = "0.11"
thiserror = "2"
zeroize = { version = "1.9", features = ["derive"] }
# The shredder's overwrite pattern.
rand_core = { version = "0.9", features = ["os_rng"] }

[dev-dependencies]
proptest = "1"
tempfile = "3"
