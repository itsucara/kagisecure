[package]
name = "kagisecure-cli"
description = "The kagisecure command line interface."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "kagisecure"
path = "src/main.rs"

[dependencies]
kagisecure-core = { workspace = true, features = ["secret-material"] }
kagisecure-import = { workspace = true }
kagisecure-ipc = { workspace = true }
kagisecure-agent = { workspace = true }
kagisecure-extension-ipc = { workspace = true }
kagisecure-shared = { workspace = true }
# The bundle format and grant types of `kagisecure host-bundle` (ADR-0043).
kagisecure-host = { workspace = true }
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
rpassword = "7"
directories = "6"
zeroize = { version = "1.9", features = ["derive"] }
anyhow = "1"
serde_json = "1"

# The Windows half of `generate::copy_to_clipboard`: `OpenClipboard` / `EmptyClipboard` /
# `SetClipboardData(CF_UNICODETEXT)`, plus the two clipboard-history/Cloud-Clipboard exclusion
# formats. Already in the lock file (by way of `directories`/`tempfile`'s own dependencies on
# other platforms' Windows crates), so this adds no new crate to `cargo deny`'s ledger — only the
# four feature gates this module's calls need, per `kagisecure-ipc/Cargo.toml`'s precedent of
# feature-gating `windows-sys` per Win32 module rather than pulling in the whole API surface.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Ole",
] }

[dev-dependencies]
# Only for `Error::all_variants_for_test` in `main.rs`'s exit-code test, which needs one
# constructible instance of every `kagisecure_core::Error` variant — see that feature's doc
# comment in `kagisecure-core`.
kagisecure-core = { workspace = true, features = ["secret-material", "test-support"] }
assert_cmd = "2"
# The end-to-end tests drive the sidecar twice over: once through a hand-rolled JSON-RPC driver
# that keeps every byte of stdout (the canary needs a byte-level assertion), and once through the
# real client API, so that what an actual MCP client sees is what is tested.
rmcp = { version = "3.2", features = ["client", "transport-child-process"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "time"] }
predicates = "3"
serde_json = "1"
tempfile = "3"
# Builds a tiny hand-written 1PUX archive in `tests/import.rs`, for the tests that need a source
# file the importer can actually parse rather than reject. Same version as `kagisecure-import`.
zip = { version = "8", default-features = false, features = ["deflate"] }
kagisecure-test-support = { workspace = true }
