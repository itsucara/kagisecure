[package]
name = "kagisecure-host"
description = "kagisecure on a headless host: releases machine credentials under standing grants from a bundle signed on the owner's Mac (ADR-0043)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "kagisecure-host"
path = "src/main.rs"

[dependencies]
# The injector (stdin delivery, masking, process groups, deadlines) and the machine-vault grant
# types are the core's: a host and the Mac app run granted commands through the same code.
kagisecure-core = { workspace = true, features = ["secret-material"] }
# The host's key pair is a device key, and bundles are sealed and signed with the shared-vault
# primitives (`kagisecure_shared::host_bundle`).
kagisecure-shared = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
serde_json = "1"
ciborium = "0.2"
thiserror = "2"
zeroize = { version = "1.9", features = ["derive"] }
clap = { version = "4", features = ["derive", "env"] }
anyhow = "1"

[dev-dependencies]
tempfile = "3"
