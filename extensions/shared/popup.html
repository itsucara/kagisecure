<!doctype html>
<meta charset="utf-8" />
<title>Kagisecure</title>
<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0;
    width: 300px;
    font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: Canvas;
    color: CanvasText;
  }
  header { display: flex; align-items: center; gap: 8px; padding: 12px 14px 8px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: #8e8e93; flex: none; }
  .dot.ready { background: #30d158; }
  .dot.locked { background: #ff9f0a; }
  .dot.error { background: #ff453a; }
  h1 { font-size: 13px; font-weight: 600; margin: 0; }
  .detail { padding: 0 14px 10px; opacity: 0.75; }
  .evidence { padding: 0 14px 10px; font-size: 11px; opacity: 0.6; word-break: break-all; }
  .evidence div { margin-bottom: 2px; }
  hr { border: 0; border-top: 1px solid rgba(120,120,128,0.3); margin: 0; }
  .items { padding: 6px; }
  button.row {
    all: unset; display: block; box-sizing: border-box; width: 100%;
    padding: 7px 8px; border-radius: 6px; cursor: pointer;
  }
  button.row:hover { background: rgba(10,132,255,0.14); }
  button.row:focus-visible { outline: 2px solid #0a84ff; outline-offset: -2px; }
  .title { font-weight: 600; }
  .sub { font-size: 12px; opacity: 0.65; }
  .actions { display: flex; gap: 6px; padding: 8px 14px 12px; }
  .actions button {
    flex: 1; font: inherit; padding: 6px 8px; border-radius: 6px;
    border: 1px solid rgba(120,120,128,0.4); background: transparent; color: inherit;
    cursor: pointer;
  }
  .actions button:hover { background: rgba(120,120,128,0.14); }
  .empty { padding: 10px 14px 14px; opacity: 0.7; }
  .continuing {
    display: flex; align-items: baseline; gap: 8px;
    padding: 8px 14px; margin: 0;
    background: rgba(10,132,255,0.10);
    border-bottom: 1px solid rgba(120,120,128,0.3);
  }
  .continuing .who { flex: 1; min-width: 0; }
  .continuing .who .sub { word-break: break-all; }
  .continuing button {
    font: inherit; padding: 3px 8px; border-radius: 6px; flex: none;
    border: 1px solid rgba(120,120,128,0.4); background: transparent; color: inherit;
    cursor: pointer;
  }
  .continuing button:hover { background: rgba(120,120,128,0.14); }
</style>
<header>
  <span class="dot" id="dot"></span>
  <h1 id="heading">Kagisecure</h1>
</header>
<div class="detail" id="detail">Checking…</div>
<div class="evidence" id="evidence"></div>
<hr />
<div class="continuing" id="continuing" hidden>
  <div class="who">
    <div class="title" id="continuing-title"></div>
    <div class="sub" id="continuing-origin"></div>
  </div>
  <button id="forget" type="button">Forget</button>
</div>
<div class="items" id="items"></div>
<div class="empty" id="empty" hidden></div>
<div class="actions">
  <button id="open">Open Kagisecure</button>
</div>
<script src="popup.js"></script>
