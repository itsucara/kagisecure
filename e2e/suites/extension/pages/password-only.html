<!doctype html>
<meta charset="utf-8" />
<title>Password only</title>
<link rel="stylesheet" href="/_style.css" />
<h1>Welcome back, alice</h1>
<p class="origin" id="origin"></p>
<!-- The second half of a two-step sign-in: the username is already known and is not an input. -->
<form id="login">
  <label for="password">Password</label>
  <input id="password" name="password" type="password" autocomplete="current-password" />
  <button type="submit">Sign in</button>
</form>
<script>
  document.getElementById("origin").textContent = location.origin;
  document.getElementById("login").addEventListener("submit", (e) => e.preventDefault());
</script>
