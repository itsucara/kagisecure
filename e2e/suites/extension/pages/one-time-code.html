<!doctype html>
<meta charset="utf-8" />
<title>Two-step verification</title>
<link rel="stylesheet" href="/_style.css" />
<h1>Two-step verification</h1>
<p class="origin" id="origin"></p>
<!-- The page a site shows after the password: one code box, one button, and nothing else. There
     is no password field here and no username; the only thing that can be written is the code. -->
<form id="verify">
  <label for="otp">Enter the code from your authenticator app</label>
  <input id="otp" name="otp" type="text" inputmode="numeric" autocomplete="one-time-code" />
  <button type="submit">Verify</button>
</form>
<script>
  document.getElementById("origin").textContent = location.origin;
  document.getElementById("verify").addEventListener("submit", (e) => e.preventDefault());
</script>
