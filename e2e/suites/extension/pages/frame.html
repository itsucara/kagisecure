<!doctype html>
<meta charset="utf-8" />
<title>Framed form</title>
<link rel="stylesheet" href="/_style.css" />
<body style="margin: 16px auto; max-width: 380px">
<p class="origin" id="origin"></p>
<form id="login">
  <label for="username">Username</label>
  <input id="username" name="username" type="text" autocomplete="username" />
  <label for="password">Password</label>
  <input id="password" name="password" type="password" autocomplete="current-password" />
</form>
<script>
  document.getElementById("origin").textContent = "frame origin: " + location.origin;
  document.getElementById("login").addEventListener("submit", (e) => e.preventDefault());
</script>
